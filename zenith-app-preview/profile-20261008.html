<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060b10"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Zenith Client App fictional profile and coaching journey design preview."><title>My Zenith | Premium Profile Preview</title><link rel="icon" type="image/svg+xml" href="../assets/zenith-favicon.svg"><style>
/* Base Zenith UI */
/* Zenith Client App — concept only. Scoped; no host-site dependencies. */
:root{color-scheme:dark;--bg:#060b10;--surface:#0d1922;--surface2:#10212d;--border:#223643;--border-hi:#36576b;--text:#eef5f8;--muted:#a4bac8;--faint:#7892a3;--accent:#82c9ed;--accent-strong:#5cb8e9;--success:#91d0b4;--warn:#e5bf81;--radius:18px}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--text);background:var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{width:100%;max-width:440px;min-height:100dvh;margin:0 auto;background:radial-gradient(ellipse 230px 290px at 103% 3%,rgba(26,70,104,.32),transparent 86%),radial-gradient(ellipse 240px 240px at -20% 48%,rgba(15,37,58,.12),transparent 87%),var(--bg);position:relative;overflow:hidden}
.main{padding:0 21px calc(110px + env(safe-area-inset-bottom,0px))}
.header{height:84px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(174,210,230,.12);padding:14px 1px}
.brand-logo{display:block;width:47px;height:40px;object-fit:contain;object-position:left center}
.step-pill{display:flex;gap:8px;align-items:center;border:1px solid #29414d;background:rgba(10,22,30,.90);border-radius:22px;height:40px;padding:0 12px;color:var(--muted);font-size:12px}
.step-pill strong{font-size:14px;color:var(--text)}
.ic{width:19px;height:19px;display:inline-flex;vertical-align:middle;flex:none}
.ic svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linejoin:round;stroke-linecap:round}
.step-pill .ic{color:var(--accent)}
.lead{margin:25px 2px 0}
.eyebrow{font-size:11px;line-height:1.5;letter-spacing:.16em;color:#9ec0d2;font-weight:700}
.lead h1,.page-title{font-size:33px;line-height:1.12;font-weight:650;letter-spacing:-1.2px;margin:9px 0 7px}
.lead p,.subline{color:var(--muted);font-size:14px;line-height:1.55;margin:0}
.hero{margin:23px 0 0;border:1px solid #39627a;border-radius:24px;min-height:213px;position:relative;overflow:hidden;padding:21px;background:linear-gradient(128deg,#1a3344,#132d40 53%,#081520);box-shadow:0 15px 42px rgba(0,0,0,.12),inset 0 1px rgba(223,245,255,.07)}
.hero::before{content:"";position:absolute;inset:-70px -75px auto auto;width:270px;height:260px;background:radial-gradient(ellipse,rgba(75,164,216,.18),transparent 70%)}
.hero>*{position:relative}
.hero .eyebrow{display:flex;gap:8px;align-items:center;font-size:10px;color:#acd9ef}
.glow-dot{width:6px;height:6px;border-radius:50%;background:#8dd8fb;box-shadow:0 0 12px #80c8ed}
.hero h2{font-size:39px;font-weight:720;letter-spacing:-1.5px;margin:19px 0 5px}
.hero .meta{font-size:14px;color:#c6d7e1;margin:0 0 8px}
.hero .schedule{font-size:12px;color:#adc3d0;display:flex;gap:7px;align-items:center}
.hero .buttons{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:24px}
.btn{background:var(--accent);border:1px solid var(--accent);color:#08202c;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:750;min-height:43px;box-shadow:0 6px 18px rgba(3,10,15,.16)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:transparent;color:var(--accent);border-color:#37647a;box-shadow:none}
.text-link{border:0;background:none;padding:8px 0;font-size:12px;font-weight:650;color:#c1e2f2}
.section-header{margin:25px 2px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-header h2{font-size:17px;letter-spacing:-.4px;font-weight:680;margin:0}
.section-header a,.section-header button{font-size:12px;color:#a5d3e9;background:none;border:0;font-weight:650}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{background:linear-gradient(150deg,#10232e,#0b171f);border:1px solid #253c49;border-radius:16px;padding:12px 10px;min-height:111px}
.metric .label{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:11px}
.metric .label .ic{color:#88c9e8;width:15px;height:15px}
.metric strong{display:block;font-size:21px;letter-spacing:-.7px;font-weight:690;margin-top:12px}
.metric small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.track{height:4px;background:#29414f;border-radius:10px;overflow:hidden;margin-top:11px}
.track span{display:block;height:100%;max-width:100%;background:var(--accent);border-radius:10px;transition:width .2s ease}
.panel{border:1px solid var(--border);border-radius:17px;background:rgba(13,26,35,.92)}
.next{padding:12px 13px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.tile-icon{width:40px;height:40px;flex:none;display:grid;place-items:center;background:#1b3340;border-radius:12px;color:#9cd9f3}
.tile-icon.good{background:#17312d;color:var(--success)}
.tile-icon.warn{background:#30291f;color:var(--warn)}
.next .copy{flex:1;min-width:0}
.title-small{font-size:13px;font-weight:680;color:var(--text)}
.sub-small{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}
.tag{font-size:11px;font-weight:680;padding:6px 9px;border-radius:8px;background:#193442;color:#a7d9ef;white-space:nowrap}
.tag.good{background:#1a362d;color:#a1ddbd}
.tag.warn{background:#342b1f;color:#f0c78e}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(5,11,15,.97);border-top:1px solid #253744;padding:11px 7px calc(11px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(14px)}
.bottom-nav a{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;font-size:11px;color:#94a9b7;min-height:49px}
.bottom-nav a.current{color:var(--accent)}
.bottom-nav .ic{width:21px;height:21px}
.bottom-nav .mark{height:3px;width:3px;border-radius:50%;background:transparent}
.bottom-nav a.current .mark{background:var(--accent)}
.subheader{display:flex;align-items:center;gap:13px;min-height:72px;padding:20px 0 8px}
.back{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:#111f2a;border:1px solid #25404e;color:#c5dfeb}
.subheader .heading{font-size:15px;font-weight:730;letter-spacing:-.2px}
.feature-kicker{font-size:11px;letter-spacing:.13em;font-weight:650;color:#91b9cd}
.summary{margin-top:19px;background:linear-gradient(142deg,#132c3d,#0b1a25 80%);padding:20px;border-radius:20px;border:1px solid #2e5062}
.summary h1{font-size:29px;font-weight:690;letter-spacing:-1px;margin:9px 0 6px}
.summary p{font-size:13px;color:#b2c9d5;line-height:1.5;margin:0}
.summary-stats{display:flex;gap:22px;margin-top:18px}
.summary-stat strong{font-size:20px;color:var(--text);display:block}
.summary-stat span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tabs{display:flex;gap:5px;margin:21px 0 0;padding:4px;border:1px solid #273e4b;border-radius:13px;background:#0e1d27}
.tabs button{flex:1;border:0;color:#9eb8c7;background:transparent;border-radius:9px;padding:11px;font-size:12px;font-weight:700}
.tabs button.selected{background:#1f455b;color:#d7f0fc}
.group-title{font-size:13px;letter-spacing:.02em;color:#b1cad7;margin:25px 2px 11px;font-weight:740}
.timeline{display:grid;gap:9px}
.timeline-row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #243c49;border-radius:15px;background:#0d1b25}
.timeline-row .info{flex:1;min-width:0}
.timeline-row .status{font-size:11px;color:#a4d7bd;white-space:nowrap}
.timeline-row .status.muted{color:#e4c08c}
.timeline-row .ic{width:18px;height:18px}
.timeline-row .detail{color:var(--muted);font-size:11px;margin-top:4px}
.timeline-row button{border-radius:10px;border:1px solid #3b6377;background:#163648;color:#b6e5fa;padding:8px 10px;font-size:11px}
.info-note{margin:16px 1px;border-left:2px solid #4b829e;padding:3px 0 3px 12px;color:#a7bfcc;line-height:1.55;font-size:12px}
.page-title{font-size:31px;margin:15px 0 8px}
.page-intro{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 19px}
.content-card{border:1px solid #263d4b;border-radius:18px;background:linear-gradient(145deg,#10232f,#0b1923);padding:18px;margin-top:14px}
.content-card h2{font-size:18px;margin:2px 0 7px;letter-spacing:-.35px}
.content-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.content-card .cta-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.mini-list{display:grid;gap:0;margin-top:11px}
.mini-list .list-item{padding:14px 0;border-bottom:1px solid #223743;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini-list .list-item:last-child{border:0;padding-bottom:3px}
.list-item .item-text{flex:1}
.chart{height:110px;margin-top:18px;display:flex;align-items:flex-end;justify-content:space-around;gap:10px}
.chart span{flex:1;max-width:24px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#82c9ed,#254b62)}
.demo-label{display:inline-flex;border:1px solid #34566a;border-radius:30px;color:#abd3e4;padding:6px 10px;font-size:10px;letter-spacing:.06em;font-weight:700;margin:16px 0 0}
.muted{color:var(--muted)}
.foot-note{margin:22px 0;color:#8a9faf;font-size:11px;line-height:1.5}
.pad-bottom{height:24px}
@media(min-width:540px){body{background:#101a21}.app{box-shadow:0 0 0 1px #355064,0 28px 80px rgba(0,0,0,.35)}}
@media(max-width:340px){.main{padding-left:15px;padding-right:15px}.hero{padding:17px}.metric{padding:10px 7px}.metric strong{font-size:18px}.step-pill{padding:0 9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* Personal Profile & Coaching Journey */
/* Zenith Screen 10 — Personal Profile & Coaching Journey. Fictional client data. */
.identity-page{padding-bottom:27px}
.identity-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #294251;padding:22px 1px 18px}
.identity-head .brand-logo{width:38px;height:38px}
.identity-brand{display:flex;align-items:center;gap:12px}
.identity-brand-copy{display:grid;gap:4px}
.identity-brand-copy small{font-size:9px;letter-spacing:.17em;font-weight:760;color:#94bfd2}
.identity-brand-copy strong{font-size:18px;font-weight:750;letter-spacing:-.4px}
.identity-date{white-space:nowrap;font-size:10px;color:#b5d9ec;background:#143141;border:1px solid #3b6a80;border-radius:99px;padding:8px 11px;font-weight:750}
.identity-hero{position:relative;isolation:isolate;overflow:hidden;border:1px solid #416e87;background:radial-gradient(circle at 85% 0%,#29596f,#153647 55%,#0b1e2b 100%);border-radius:24px;padding:23px 19px 18px;margin-top:24px;box-shadow:0 19px 40px #0003,inset 0 1px #f6fbff13}
.identity-hero:before{content:"";position:absolute;z-index:-1;pointer-events:none;right:-103px;top:-114px;width:255px;height:255px;border:1px solid #ade4fb25;border-radius:50%;box-shadow:0 0 0 34px #bceaff0b,0 0 0 75px #cceeff06}
.identity-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.identity-hero-top span{font-size:10px;color:#b0d9ed;letter-spacing:.14em;font-weight:780}
.identity-demo-pill{color:#c5e9f8;border-radius:99px;background:#24485c;border:1px solid #4b7e95;padding:6px 10px;white-space:nowrap;font-size:10px;letter-spacing:.02em;font-weight:730}
.identity-intro{display:flex;align-items:center;gap:17px;margin-top:23px}
.identity-avatar{display:grid;place-items:center;width:77px;height:77px;flex:0 0 77px;border-radius:23px;background:linear-gradient(145deg,#2e647d,#174051);border:1px solid #80b4ca;box-shadow:inset 0 1px #f5ffff15,0 7px 18px #0004;position:relative}
.identity-avatar svg{width:38px;height:38px;stroke:#c1e9fa;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.identity-avatar:after{content:"";position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border:3px solid #183546;background:#81d6b0;border-radius:50%}
.identity-person{min-width:0}
.identity-person small{font-size:10px;display:block;color:#accfdf;letter-spacing:.06em}
.identity-person h1{font-size:27px;line-height:1.11;letter-spacing:-1px;font-weight:780;margin:6px 0 6px}
.identity-person .caption{font-size:11px;color:#c1dce8;line-height:1.5}
.identity-hero-quote{margin:18px 0 0;font-size:12px;line-height:1.65;color:#bad5e1;max-width:300px}
.identity-hero-stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #7094a15c;margin-top:21px;padding-top:17px;gap:0}
.identity-hero-stats>div{padding:0 9px;text-align:center;border-right:1px solid #5f879457}
.identity-hero-stats>div:first-child{padding-left:0;text-align:left}
.identity-hero-stats>div:last-child{padding-right:0;border:0;text-align:right}
.identity-hero-stats b{font-size:19px;line-height:1;font-weight:790;letter-spacing:-.65px;display:block}
.identity-hero-stats small{font-size:10px;line-height:1.5;color:#aac9d8;display:block;margin-top:7px}
.identity-section{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:28px 2px 13px}
.identity-section h2{font-size:18px;letter-spacing:-.45px;font-weight:750;margin:0}
.identity-section small{font-size:11px;color:#99bbc9}
.identity-program{border:1px solid #365f74;background:linear-gradient(142deg,#143344,#102534 72%,#0b1d29);border-radius:21px;padding:19px 17px 17px}
.identity-program-overline{font-size:10px;color:#a5d6e8;font-weight:780;letter-spacing:.13em}
.identity-program h3{font-size:23px;line-height:1.15;letter-spacing:-.7px;font-weight:770;margin:14px 0 6px}
.identity-program>p{font-size:12px;line-height:1.6;color:#b5cedb;margin:0}
.identity-program-stamp{display:inline-flex;align-items:center;gap:7px;margin-top:15px;background:#1d493d;border:1px solid #4b826e;border-radius:99px;padding:8px 10px;color:#bfe8d5;font-size:10px;font-weight:770}
.identity-program-stamp .ic{width:15px;height:15px}
.identity-program-track{height:5px;background:#325367;border-radius:10px;margin:18px 0 12px;overflow:hidden}
.identity-program-track span{display:block;width:16.666%;height:100%;border-radius:10px;background:linear-gradient(90deg,#74bada,#b2ebff)}
.identity-program-progress{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#bad7e3;font-size:11px}
.identity-program-progress strong{color:#ecf9fe;font-size:12px;font-weight:750}
.identity-program-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.identity-program-actions a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;font-size:12px;font-weight:750;padding:9px;border:1px solid #457993;background:#1c445a;border-radius:12px;color:#d4edf9}
.identity-program-actions a .ic{width:16px;height:16px}
.identity-included{display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:14px;background:#0d232e;border:1px solid #2f4e5d;border-radius:15px}
.identity-included .icon{flex:none;height:31px;width:31px;border-radius:10px;background:#204b3c;border:1px solid #3f7960;color:#b8e9cb;display:grid;place-items:center}
.identity-included strong{font-size:12px;font-weight:745;display:block}
.identity-included p{font-size:11px;color:#a9c6d1;line-height:1.6;margin:5px 0 0}
.identity-timeline{border:1px solid #2b4857;border-radius:20px;background:linear-gradient(142deg,#112633,#0b1c27);padding:17px 14px 10px}
.identity-timeline-item{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:22px}
.identity-timeline-item:not(:last-child):before{content:"";position:absolute;top:27px;left:13px;bottom:1px;width:1px;background:#385769}
.identity-timeline-item:last-child{padding-bottom:7px}
.identity-timeline-mark{height:28px;width:28px;display:grid;place-items:center;border-radius:50%;background:#1a3a4b;border:1px solid #42687e;color:#9ccfe6}
.identity-timeline-mark .ic{height:14px;width:14px}
.identity-timeline-item.completed .identity-timeline-mark{background:#1c473c;border-color:#538673;color:#b0ebcb}
.identity-timeline-item.current .identity-timeline-mark{background:#225770;border-color:#75bbdd;color:#d8f7ff;box-shadow:0 0 0 4px #234a5f45}
.identity-timeline-body{padding-top:1px}
.identity-timeline-body .stage{font-size:10px;letter-spacing:.12em;font-weight:760;color:#9bc2d3}
.identity-timeline-body h3{font-size:14px;line-height:1.4;font-weight:755;letter-spacing:-.22px;margin:5px 0 5px}
.identity-timeline-body p{font-size:11px;color:#a6c2cf;line-height:1.55;margin:0}
.identity-timeline-body a{display:inline-flex;align-items:center;gap:5px;color:#b9e3f5;font-size:11px;font-weight:735;margin-top:10px;text-decoration:none}
.identity-timeline-body a .ic{height:14px;width:14px}
.identity-stage-tag{font-size:10px;color:#acddeb;border:1px solid #366b85;background:#173e52;border-radius:99px;padding:5px 8px;display:inline-block;margin-top:9px}
.identity-highlights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.identity-highlight-card{border:1px solid #2e4b5a;border-radius:17px;background:linear-gradient(150deg,#122b39,#0c1c26);padding:15px 13px;min-width:0}
.identity-highlight-card .icon{height:28px;width:28px;border-radius:9px;background:#204759;color:#afd8ed;display:grid;place-items:center}
.identity-highlight-card .icon .ic{width:16px;height:16px}
.identity-highlight-card strong{font-size:24px;letter-spacing:-.9px;font-weight:780;display:block;margin-top:14px;line-height:1}
.identity-highlight-card strong span{font-size:12px;color:#a5c4d2;font-weight:550}
.identity-highlight-card small{font-size:11px;line-height:1.5;color:#abc7d5;display:block;margin-top:7px}
.identity-highlight-card a{display:inline-flex;gap:5px;align-items:center;color:#b7e0f1;font-size:11px;font-weight:725;margin-top:12px}
.identity-highlight-card a .ic{width:13px;height:13px}
.identity-coach-card{border:1px solid #35596c;background:linear-gradient(145deg,#183648,#102534);border-radius:20px;padding:17px}
.identity-coach-head{display:flex;align-items:center;gap:12px}
.identity-coach-avatar{height:42px;width:42px;display:grid;place-items:center;background:#24495b;color:#bee7f9;border:1px solid #48758a;border-radius:13px}
.identity-coach-avatar .ic{width:23px;height:23px}
.identity-coach-head strong{font-size:15px;font-weight:755;display:block}
.identity-coach-head small{font-size:11px;color:#a7c5d4;display:block;margin-top:4px}
.identity-coach-card>p{color:#b5cfdb;font-size:12px;line-height:1.6;margin:15px 0 13px}
.identity-coach-card details{border-top:1px solid #41617482;padding-top:9px}
.identity-coach-card summary{font-size:12px;color:#b5e1f5;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:35px;cursor:pointer;list-style:none;font-weight:740}
.identity-coach-card summary::-webkit-details-marker{display:none}
.identity-coach-card details[open] summary>.ic{transform:rotate(90deg)}
.identity-coach-card details p{font-size:11px;color:#aac6d4;line-height:1.6;margin:9px 0 0}
.identity-account{border:1px solid #294554;background:#0d202c;border-radius:19px;padding:4px 15px}
.identity-account details{border-bottom:1px solid #2b4653}
.identity-account details:last-child{border:0}
.identity-account summary{display:flex;align-items:center;gap:11px;min-height:65px;list-style:none;cursor:pointer}
.identity-account summary::-webkit-details-marker{display:none}
.identity-account .item-icon{height:32px;width:32px;display:grid;place-items:center;color:#b4dbea;border:1px solid #33596e;background:#1a3b4c;border-radius:10px;flex:none}
.identity-account .item-icon .ic{width:17px;height:17px}
.identity-account .copy{flex:1;min-width:0}
.identity-account .copy strong{display:block;font-size:12px;font-weight:750}

const WORKOUT_SAMPLE_KEY='zenith-preview-workout-v1';

}catch(e){return {phase:'ready',logged:0};}
}

}

function render(){const page=document.body.getAttribute('data-page')||'home';if(page==='earlier')return earlier();if(page==='training')return training();if(page==='workout-plan')return workoutPlan();if(page==='nutrition')return nutrition();if(page==='nutrition-plan')return nutritionPlan();if(page==='meal')return meal();if(page==='progress')return progress();if(page==='profile')return profile();home();}
document.addEventListener('click',function(e){
const profileCmd=e.target.closest('[data-profile-command]');
if(profileCmd){const cmd=profileCmd.getAttribute('data-profile-command');
if(cmd==='show-reset'){profileResetOpen=true;profile();return;}
if(cmd==='cancel-reset'){profileResetOpen=false;profile();return;}
}
const foodAdjust=e.target.closest('[data-food-adjust]');
if(foodAdjust){if(state.dinner&&!dinnerEditMode)return;prepareDinnerDraft();
const parts=foodAdjust.getAttribute('data-food-adjust').split(':'),food=DINNER_FOODS.find(f=>f.id===parts[0]);
if(!food||!['plus','minus'].includes(parts[1]))return;
const delta=parts[1]==='plus'?food.step:-food.step;
dinnerDraft[food.id]=Math.max(0,Math.min(food.max,Math.round((dinnerDraft[food.id]+delta)*10)/10));dinnerError='';meal();return;}
const mealCommand=e.target.closest('[data-meal-command]');
if(mealCommand){
const cmd=mealCommand.getAttribute('data-meal-command');
if(cmd==='edit'&&state.dinner){dinnerDraft=dinnerSavedPortions();dinnerEditMode=true;dinnerRemoveConfirm=false;dinnerError='';meal();return;}
if(cmd==='cancel'){dinnerDraft=null;dinnerEditMode=false;dinnerError='';meal();return;}
if(cmd==='save'){prepareDinnerDraft();if(dinnerNutrition(dinnerDraft).kcal<=0){dinnerError='Select at least one food amount.';meal();return;}
state.dinner=true;state.dinnerLog={portions:normalizeDinnerPortions(dinnerDraft)};save();
dinnerDraft=null;dinnerEditMode=false;dinnerRemoveConfirm=false;dinnerError='';window.location.href=dinnerOrigin();return;}
if(cmd==='remove'&&state.dinner){dinnerRemoveConfirm=true;meal();return;}
if(cmd==='cancel-remove'){dinnerRemoveConfirm=false;meal();return;}
if(cmd==='confirm-remove'&&state.dinner&&dinnerRemoveConfirm){state.dinner=false;state.dinnerLog=null;state.walk=false;save();dinnerRemoveConfirm=false;dinnerEditMode=false;dinnerDraft=null;meal();return;}
return;}
const dietDay=e.target.closest('[data-diet-day]');
if(dietDay){const n=Number(dietDay.getAttribute('data-diet-day'));if(Number.isInteger(n)&&n>=0&&n<7){
nutritionPlanDay=n;planExpandedMeal=null;
if(window.history&&typeof window.history.replaceState==='function')window.history.replaceState(null,'','nutrition-plan.html?day='+n);
const summary=document.getElementById('diet-day-summary');if(summary)summary.innerHTML=nutritionPlanDaily();
const entries=document.getElementById('diet-entries');if(entries)entries.innerHTML=planDays[n].meals.map((m,i)=>nutritionPlanRow(i)).join('');
const label=document.getElementById('diet-day-label');if(label)label.textContent=planDays[n].short;
document.querySelectorAll('[data-diet-day]').forEach(b=>{const selected=Number(b.getAttribute('data-diet-day'))===n;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});
}return;}
const dietMeal=e.target.closest('[data-diet-meal]');
if(dietMeal){const n=Number(dietMeal.getAttribute('data-diet-meal'));if(Number.isInteger(n)&&n>=0&&n<4){
planExpandedMeal=planExpandedMeal===n?null:n;
document.querySelectorAll('[data-diet-meal]').forEach(b=>{const index=Number(b.getAttribute('data-diet-meal'));const opened=index===planExpandedMeal;b.setAttribute('aria-expanded',String(opened));b.innerHTML=(opened?'Hide food & portions':'Food & portions')+' '+icon('chevron');const panel=document.getElementById('diet-meal-panel-'+index);if(panel)panel.hidden=!opened;});
}return;}
const mealDetail=e.target.closest('[data-nutrition-detail]');
if(mealDetail){const id=mealDetail.getAttribute('data-nutrition-detail');const valid=demoNutrition.meals.some(m=>m.id===id&&m.id!=='dinner');if(valid){
nutritionExpanded=nutritionExpanded===id?null:id;
document.querySelectorAll('[data-nutrition-detail]').forEach(function(b){const active=b.getAttribute('data-nutrition-detail')===nutritionExpanded;b.setAttribute('aria-expanded',String(active));const container=b.closest('.nutrition-meal');if(container)container.setAttribute('aria-expanded',String(active));const node=document.getElementById('nutrition-detail-'+b.getAttribute('data-nutrition-detail'));if(node)node.hidden=!active;});
}return;}
const planWeekButton=e.target.closest('[data-plan-week]');
if(planWeekButton){const i=Number(planWeekButton.getAttribute('data-plan-week'));if(Number.isInteger(i)&&i>=0&&i<programWeeks.length){
programSelectedWeek=i;programExpandedDay=null;
if(window.history&&typeof window.history.replaceState==='function')window.history.replaceState(null,'','workout-plan.html?week='+i);
const focus=document.getElementById('program-week-focus');if(focus)focus.innerHTML=programWeekFocus();
const list=document.getElementById('program-session-list');if(list)list.innerHTML=programSessionRows();
document.querySelectorAll('[data-plan-week]').forEach(function(b){const selected=Number(b.getAttribute('data-plan-week'))===i;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});
}return;}
const planDayButton=e.target.closest('[data-plan-day]');
if(planDayButton){const i=Number(planDayButton.getAttribute('data-plan-day'));if(Number.isInteger(i)&&i>=0&&i<programMovements.length){
programExpandedDay=programExpandedDay===i?null:i;
document.querySelectorAll('[data-plan-day]').forEach(function(b){const j=Number(b.getAttribute('data-plan-day'));const expanded=j===programExpandedDay;b.setAttribute('aria-expanded',String(expanded));const panel=document.getElementById('plan-session-panel-'+j);if(panel)panel.hidden=!expanded;});
}return;}
const dayButton=e.target.closest('[data-training-day]');
if(dayButton){const idx=Number(dayButton.getAttribute('data-training-day'));if(Number.isInteger(idx)&&idx>=0&&idx<trainingDays.length){trainingSelected=idx;const detail=document.getElementById('training-day-summary');if(detail)detail.innerHTML=trainingDayDetail(idx);document.querySelectorAll('[data-training-day]').forEach(function(b){const selected=Number(b.getAttribute('data-training-day'))===idx;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});}return;}
const progressArea=e.target.closest('[data-progress-tab]');
if(progressArea){const key=progressArea.getAttribute('data-progress-tab');if(['training','activity','body'].includes(key)){progressTab=key;progress();}return;}
const progressBody=e.target.closest('[data-progress-body]');
if(progressBody){const metric=progressBody.getAttribute('data-progress-body');if(['waist','weight'].includes(metric)){progressBodyMetric=metric;progress();}return;}
const action=e.target.closest('[data-action]');const tab=e.target.closest('[data-tab]');
if(tab){selectedTab=tab.getAttribute('data-tab');earlier();return;}
if(!action)return;
const name=action.getAttribute('data-action');

if(name==='walk'){state.walk=true;save();home();}
if(name==='water'){state.water=Math.min(2500,state.water+250);save();progress();}
if(name==='reset'){state={dinner:false,dinnerLog:null,walk:false,water:1800};save();try{sessionStorage.setItem(WORKOUT_SAMPLE_KEY,JSON.stringify({version:2,status:'ready',mode:'set',cursor:0,sets:Array(15).fill(false),records:Array(15).fill(null),draft:{weight:'',reps:''},restEnd:0,restStart:0,restSeconds:0}));}catch(e){}profileResetOpen=false;profile();}
if(name==='training-preview'){const box=document.getElementById('training-preview-panel');if(box){trainingPreviewOpen=!trainingPreviewOpen;box.hidden=!trainingPreviewOpen;action.setAttribute('aria-expanded',String(trainingPreviewOpen));const label=action.querySelector('.training-preview-label');if(label)label.textContent=trainingPreviewOpen?'Hide movement preview':'Preview movements';}}
});
render();
})();
